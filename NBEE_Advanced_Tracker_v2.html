<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBEE Advanced Tracker</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f4f6fb}header{background:#0b5cab;color:#fff;padding:14px;text-align:center}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0}.cat{background:#e8f0fe;padding:10px;font-weight:700;cursor:pointer;margin-top:8px}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px;border-bottom:1px solid #eee}.name{flex:1;min-width:220px}.note{flex:2;min-width:180px}.btn{padding:6px 10px}.search{width:100%;padding:10px}progress{width:100%;height:22px}</style></head><body><header><h2>NBEE 2026 Advanced Tracker</h2><div id="stats"></div></header><div class="wrap"><div class="card"><progress id="prog" max="100"></progress></div><div class="card"><input id="search" class="search" placeholder="Search..." onkeyup="render()"></div><div class="card"><input id="newCat" placeholder="Category"><input id="newDoc" placeholder="Document"><button onclick="addDoc()">Add</button></div><div class="card" id="list"></div></div><script>let docs=JSON.parse(localStorage.getItem('advdocs')||'null')||[['Identity','Passport (You)'],['Identity','Passport (Spouse)'],['Employment','LMIA Approval'],['Employment','CGI Reference Letter'],['Forms','NB-005']];let collapsed=JSON.parse(localStorage.getItem('collapsed')||'{}');function save(){localStorage.setItem('advdocs',JSON.stringify(docs));}function addDoc(){let c=(newCat.value||'Additional').trim();let d=newDoc.value.trim();if(!d)return;let exists=docs.some(x=>x[0].toLowerCase()==c.toLowerCase()&&x[1].toLowerCase()==d.toLowerCase());if(exists){alert('Document already exists');return;}let cat=docs.find(x=>x[0].toLowerCase()==c.toLowerCase());if(cat)c=cat[0];docs.push([c,d]);save();newDoc.value='';render();}function move(i,dir){let cat=docs[i][0];let j=i+dir;if(j<0||j>=docs.length||docs[j][0]!=cat)return;[docs[i],docs[j]]=[docs[j],docs[i]];save();render();}function del(i){docs.splice(i,1);save();render();}function toggle(c){collapsed[c]=!collapsed[c];localStorage.setItem('collapsed',JSON.stringify(collapsed));render();}function render(){let q=(search.value||'').toLowerCase();let list=document.getElementById('list');list.innerHTML='';let done=0;let total=docs.length;let groups={};docs.forEach((d,i)=>{if(q && !(d[0]+' '+d[1]).toLowerCase().includes(q)) return;(groups[d[0]]||(groups[d[0]]=[])).push([d,i]);});Object.keys(groups).forEach(cat=>{let comp=0;groups[cat].forEach(x=>{let s=JSON.parse(localStorage.getItem('item'+x[1])||'{}');if(s.done){comp++;done++;}});let h=document.createElement('div');h.className='cat';h.innerHTML=(collapsed[cat]?'▶':'▼')+' '+cat+' ('+comp+'/'+groups[cat].length+')';h.onclick=()=>toggle(cat);list.appendChild(h);let wrap=document.createElement('div');if(collapsed[cat])wrap.className='hidden';groups[cat].forEach(([d,i])=>{let s=JSON.parse(localStorage.getItem('item'+i)||'{}');let r=document.createElement('div');r.className='row';r.innerHTML=`<input type='checkbox' ${s.done?'checked':''} onchange="let x=JSON.parse(localStorage.getItem('item${i}')||'{}');x.done=this.checked;localStorage.setItem('item${i}',JSON.stringify(x));render();"><div class='name'>${d}</div><button class='btn' onclick='move(${i},-1)'>↑</button><button class='btn' onclick='move(${i},1)'>↓</button><input class='note' value='${s.note||''}' placeholder='Notes' onchange="let x=JSON.parse(localStorage.getItem('item${i}')||'{}');x.note=this.value;localStorage.setItem('item${i}',JSON.stringify(x));"><button onclick='del(${i})'>Delete</button>`;wrap.appendChild(r);});list.appendChild(wrap);});let pct=Math.round((done/(total||1))*100);stats.innerText=`${done}/${total} Completed (${pct}%)`;prog.value=pct;}render();</script></body></html>
