<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>NBEE 2026 Full Tracker</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f4f6fb}header{background:#0b5cab;color:#fff;padding:16px;text-align:center}.wrap{max-width:1200px;margin:auto;padding:15px}.card{background:#fff;border-radius:12px;padding:12px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.08)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px;border-bottom:1px solid #eee}.cat{background:#e8f0fe;padding:8px;font-weight:700;margin-top:10px}.name{flex:1;min-width:250px}.note{flex:2;min-width:180px}.btn{background:#0b5cab;color:#fff;border:none;padding:8px 12px;border-radius:6px}.del{background:#d32f2f}.search{width:100%;padding:10px}progress{width:100%;height:22px}</style></head><body><header><h2>NB Express Entry 2026 Complete Tracker</h2><div id='stats'></div></header><div class='wrap'><div class='card'><progress id='prog' max='100'></progress></div><div class='card'><input id='search' class='search' placeholder='Search documents...' onkeyup='render()'></div><div class='card'><input id='newDoc' placeholder='Document name'><input id='newCat' placeholder='Category'><button class='btn' onclick='addDoc()'>Add Document</button></div><div class='card' id='list'></div></div><script>const defaults=[['Identity','Passport (You)'],['Identity','Birth Certificate (You)'],['Identity','Work Permit'],['Identity','Temporary Resident Visa/eTA'],['Identity','Aadhaar Card (You)'],['Identity','Digital Photo (You)'],['Identity','Passport (Spouse)'],['Identity','Birth Certificate (Spouse)'],['Identity','Aadhaar Card (Spouse)'],['Identity','Digital Photo (Spouse)'],['Identity','Marriage Certificate'],['Language','IELTS General Test Report'],['Education','Bachelor Degree Certificate'],['Education','Official Transcripts'],['Education','WES ECA Report'],['Education','Spouse Degree Certificate'],['Education','Spouse Transcripts'],['Employment','CGI Employment Reference Letter'],['Employment','Employment Contract'],['Employment','Current Job Offer Letter'],['Employment','LMIA Approval Letter'],['Employment','Last 12 Months Pay Stubs'],['Employment','T4 Slips'],['Employment','CRA Notice of Assessment'],['NB Residency','Lease Agreement'],['NB Residency','NB Driver Licence'],['NB Residency','Utility Bills Phone'],['NB Residency','Utility Bills Electricity'],['NB Residency','Tenant Insurance'],['NB Residency','Pay Stubs Showing Address'],['Financial','6 Months Bank Statements'],['Financial','Savings Account Statements'],['Financial','Investment Statements'],['Immigration History','Current Work Permit Copy'],['Immigration History','Previous Work Permits'],['Immigration History','Previous Visa Approvals'],['Immigration History','IRCC Decision Letters'],['Spouse Documents','Spouse Employment Reference Letter'],['Spouse Documents','Spouse Work Experience Proof'],['Spouse Documents','Spouse Resume'],['Forms','NB-005 Consent & Declaration'],['Forms','NB-007 Representative Form'],['Additional','Police Clearance Certificate'],['Additional','Letter of Explanation'],['Additional','Medical Examination Tracking'],['Additional','Employer Support Letter'],['Additional','Updated Passport Copies']];let docs=JSON.parse(localStorage.getItem('nbee_full_docs')||'null')||defaults;function saveDocs(){localStorage.setItem('nbee_full_docs',JSON.stringify(docs));}function render(){let q=document.getElementById('search').value.toLowerCase();let list=document.getElementById('list');list.innerHTML='';let current='';let done=0;docs.forEach((x,i)=>{let [cat,name]=x;if(q && !(cat+' '+name).toLowerCase().includes(q)) return; if(cat!==current){current=cat;let h=document.createElement('div');h.className='cat';h.textContent=cat;list.appendChild(h);}let d=JSON.parse(localStorage.getItem('item_'+i)||'{}');if(d.done)done++;let r=document.createElement('div');r.className='row';r.innerHTML=`<input type='checkbox' ${d.done?'checked':''} onchange='updateItem(${i},"done",this.checked)'><div class='name'>${name}</div><select onchange='updateItem(${i},"status",this.value)'><option ${d.status==='Not Started'?'selected':''}>Not Started</option><option ${d.status==='Requested'?'selected':''}>Requested</option><option ${d.status==='Received'?'selected':''}>Received</option><option ${d.status==='Completed'?'selected':''}>Completed</option></select><select onchange='updateItem(${i},"priority",this.value)'><option ${d.priority==='High'?'selected':''}>High</option><option ${d.priority==='Medium'?'selected':''}>Medium</option><option ${d.priority==='Low'?'selected':''}>Low</option></select><input class='note' value='${d.note||''}' placeholder='Notes' onchange='updateItem(${i},"note",this.value)'><button class='btn del' onclick='removeDoc(${i})'>Delete</button>`;list.appendChild(r);});let pct=Math.round(done/docs.length*100);stats.textContent=`${done}/${docs.length} Documents Completed (${pct}%)`;prog.value=pct;}function updateItem(i,k,v){let d=JSON.parse(localStorage.getItem('item_'+i)||'{}');d[k]=v;localStorage.setItem('item_'+i,JSON.stringify(d));render();}function addDoc(){let n=newDoc.value.trim();let c=newCat.value.trim()||'Additional';if(!n)return;docs.push([c,n]);saveDocs();newDoc.value='';newCat.value='';render();}function removeDoc(i){docs.splice(i,1);saveDocs();render();}render();</script></body></html>
